
name: Build Promosport Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Promosport_MB_3D_Full_App_1794599763573.zip"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract project
        run: |
          mkdir app
          unzip -o "Promosport_MB_3D_Full_App_1794599763573.zip" -d app
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build web app
        working-directory: app
        run: npm run build
      - name: Build Android APK
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Promosport-MB-3D-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
