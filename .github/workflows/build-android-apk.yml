
name: Build Promosport Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Promosport_MB_3D_Full_App_1794599763573.zip"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir app
          unzip -o "Promosport_MB_3D_Full_App_1794599763573.zip" -d app
          APP_DIR=$(find app -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          test -n "$APP_DIR"

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - name: Build web app
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Prepare Android
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
        working-directory: ${{ env.APP_DIR }}

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ${{ env.APP_DIR }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Promosport-MB-3D-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
